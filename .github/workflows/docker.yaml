'name': Docker
# Permissions are disabled for all the jobs by default, and then overridden for
# specific jobs if needed.  This is a recommended practice for security reasons,
# and also allows to avoid mistakes with permissions when creating new jobs.
#
# See https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions.
'permissions': {}
'env':
  'GO_VERSION': '1.27.4'
'on':
  'push':
    'tags':
      - 'v*'
    # Builds from the default branch will be pushed with the `dev` tag.
    'branches':
      - 'master'
      - 'main'
'jobs':
  'docker':
    'runs-on': 'ubuntu-latest'
    'permissions':
      'contents': 'read'
      'packages': 'write'
    # Optional: set repository variable DOCKER_IMAGE_NAME (e.g. ghcr.io/user/dnsproxy).
    'env':
      'DOCKER_IMAGE_NAME': '${{ vars.DOCKER_IMAGE_NAME }}'
    'steps':
      - 'name': 'Checkout'
        'uses': 'actions/checkout@v6'
        'with':
          # Set to false to avoid  GITHUB_TOKEN leaking.
          #
          # See https://github.com/actions/checkout/issues/485#issuecomment-934422611.
          'persist-credentials': false
      - 'name': 'Set up Go'
        'uses': 'actions/setup-go@v6'
        'with':
          'go-version': '${{ env.GO_VERSION }}'
      - 'name': 'Set up Go modules cache'
        'uses': 'actions/cache@v4'
        'with':
          'path': '~/go/pkg/mod'
          'key': "${{ runner.os }}-go-${{ hashFiles('go.sum') }}"
          'restore-keys': '${{ runner.os }}-go-'
      - 'name': 'Set up QEMU'
        'uses': 'docker/setup-qemu-action@v3'
      - 'name': 'Set up Docker Buildx'
        'uses': 'docker/setup-buildx-action@v3'
        'with':
          'install': true
      - 'name': 'Build Docker image (push only on tags)'
        'run': |-
          set -e -u -x

          RELEASE_VERSION='dev'
          DOCKER_PUSH='0'
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_VERSION="${GITHUB_REF##*/}"
            DOCKER_PUSH='1'
          fi
          echo "RELEASE_VERSION=\"${RELEASE_VERSION}\"" >> $GITHUB_ENV

          # Default image to lowercase owner/repo (fork-friendly).  Override with
          # repository variable DOCKER_IMAGE_NAME if set.
          if [ -z "${DOCKER_IMAGE_NAME}" ]; then
            DOCKER_IMAGE_NAME="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          fi

          if [ "${DOCKER_PUSH}" = '1' ]; then
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          fi

          make \
            VERSION="${RELEASE_VERSION}" \
            DOCKER_IMAGE_NAME="${DOCKER_IMAGE_NAME}" \
            DOCKER_PUSH="${DOCKER_PUSH}" \
            VERBOSE="1" \
            docker
  'notify':
    'needs':
      - 'docker'
    'if': |
      ${{ always() &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    'runs-on': ubuntu-latest
    'env':
      'SLACK_WEBHOOK_URL': ${{ secrets.SLACK_WEBHOOK_URL }}
    'steps':
      - 'name': 'Conclusion'
        'id': 'conclusion'
        'env':
          'BUILD_RESULT': ${{ needs.docker.result }}
        'run': |-
          set -e -u

          # A skipped job means an earlier one failed, which is a failure of
          # the workflow as a whole.
          if [ "${BUILD_RESULT}" = 'success' ]; then
            status='success'
          else
            status='failure'
          fi

          echo "status=${status}" >> "${GITHUB_OUTPUT}"
      - 'name': 'Send Slack notification'
        'if': ${{ env.SLACK_WEBHOOK_URL != '' }}
        'env':
          'STATUS': ${{ steps.conclusion.outputs.status }}
          'WORKFLOW': ${{ github.workflow }}
          'REPO': ${{ github.repository }}
          'MESSAGE': ${{ github.event.head_commit.message || github.event.pull_request.title }}
          'COMMIT': ${{ github.sha }}
          'ACTOR': ${{ github.actor }}
          'EVENT_NAME': ${{ github.event_name }}
          'REF': ${{ github.ref_name }}
        'run': |-
          set -e -u

          case "${STATUS}" in
          success)
            color='good'
            ;;
          *)
            color='danger'
            ;;
          esac

          jq -n \
            --arg color "${color}" \
            --arg status "${STATUS}" \
            --arg workflow "${WORKFLOW}" \
            --arg repo "${REPO}" \
            --arg message "${MESSAGE}" \
            --arg commit "${COMMIT}" \
            --arg actor "${ACTOR}" \
            --arg event "${EVENT_NAME}" \
            --arg ref "${REF}" \
            '{attachments: [{color: $color, fields: [
              {title: "Status", value: $status, short: true},
              {title: "Repository", value: $repo, short: true},
              {title: "Workflow", value: $workflow, short: true},
              {title: "Event", value: $event, short: true},
              {title: "Ref", value: $ref, short: true},
              {title: "Commit", value: $commit, short: true},
              {title: "Author", value: $actor, short: true},
              {title: "Message", value: $message, short: false}
            ]}]}' > "${RUNNER_TEMP}/slack.json"

          curl --silent --show-error --fail \
            --header 'Content-Type: application/json' \
            --data "@${RUNNER_TEMP}/slack.json" \
            "${SLACK_WEBHOOK_URL}"
