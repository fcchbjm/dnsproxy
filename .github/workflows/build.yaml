name: Build
# Permissions are disabled for all the jobs by default, and then overridden for
# specific jobs if needed.  This is a recommended practice for security reasons,
# and also allows to avoid mistakes with permissions when creating new jobs.
#
# See https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions.
'permissions': {}
'env':
  'GO_VERSION': '1.27.4'
'on':
  'push':
    'tags':
      - 'v*'
    'branches':
      - '*'
  'pull_request':
jobs:
  tests:
    'permissions':
      'contents': 'read'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    steps:
      - 'uses': 'actions/checkout@v6'
        'with':
          # Set to false to avoid  GITHUB_TOKEN leaking.
          #
          # See https://github.com/actions/checkout/issues/485#issuecomment-934422611.
          'persist-credentials': false
      - uses: actions/setup-go@v6
        with:
          go-version: '${{ env.GO_VERSION }}'
      - name: Run tests
        env:
          CI: "1"
        run: |-
          make test
      # CODECOV_TOKEN must be the upload token from https://codecov.io/gh/fcchbjm/dnsproxy/settings
      - name: Upload coverage to Codecov
        if: >-
          success() &&
          matrix.os == 'ubuntu-latest' &&
          github.repository == 'fcchbjm/dnsproxy'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: fcchbjm/dnsproxy
          files: ./cover.out
          fail_ci_if_error: false
  build:
    needs:
      - tests
    'permissions':
      # Required by actions/create-release.
      'contents': 'write'
    runs-on: ubuntu-latest
    steps:
      - 'uses': 'actions/checkout@v6'
        'with':
          # Set to false to avoid  GITHUB_TOKEN leaking.
          #
          # See https://github.com/actions/checkout/issues/485#issuecomment-934422611.
          'persist-credentials': false
      - uses: actions/setup-go@v6
        with:
          go-version: '${{ env.GO_VERSION }}'
      - name: Build release
        run: |-
          set -e -u -x

          make VERBOSE=1 release

          ls -l build/dnsproxy-*
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # github.ref is refs/tags/v1.0.0; the Releases API expects the tag name only.
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
      - name: Upload
        if: startsWith(github.ref, 'refs/tags/v')
        uses: xresloader/upload-to-github-release@v1.3.12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "build/dnsproxy-*.tar.gz;build/dnsproxy-*.zip"
          tags: true
          draft: false
  notify:
    needs:
      - build
    if: |
      ${{ always() &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Conclusion
        id: conclusion
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |-
          set -e -u

          # A skipped build means the tests failed, which is a failure of the
          # workflow as a whole.
          if [ "${BUILD_RESULT}" = 'success' ]; then
            status='success'
          else
            status='failure'
          fi

          echo "status=${status}" >> "${GITHUB_OUTPUT}"
      - name: Send Slack notification
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        env:
          STATUS: ${{ steps.conclusion.outputs.status }}
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: |-
          set -e -u

          case "${STATUS}" in
          success)
            color='good'
            ;;
          *)
            color='danger'
            ;;
          esac

          jq -n \
            --arg color "${color}" \
            --arg status "${STATUS}" \
            --arg workflow "${WORKFLOW}" \
            --arg repo "${REPO}" \
            --arg message "${MESSAGE}" \
            --arg commit "${COMMIT}" \
            --arg actor "${ACTOR}" \
            --arg event "${EVENT_NAME}" \
            --arg ref "${REF}" \
            '{attachments: [{color: $color, fields: [
              {title: "Status", value: $status, short: true},
              {title: "Repository", value: $repo, short: true},
              {title: "Workflow", value: $workflow, short: true},
              {title: "Event", value: $event, short: true},
              {title: "Ref", value: $ref, short: true},
              {title: "Commit", value: $commit, short: true},
              {title: "Author", value: $actor, short: true},
              {title: "Message", value: $message, short: false}
            ]}]}' > "${RUNNER_TEMP}/slack.json"

          curl --silent --show-error --fail \
            --header 'Content-Type: application/json' \
            --data "@${RUNNER_TEMP}/slack.json" \
            "${SLACK_WEBHOOK_URL}"
